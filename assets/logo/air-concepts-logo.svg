<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 76" fill="none" role="img" aria-label="Air Concepts Australia Logo">
  <defs>
    <linearGradient id="acaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="acaSwoosh" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Aerodynamic Airflow Mark + "AiR" -->
  <g transform="translate(4, 4)">
    <!-- Thermal Heating Dot above 'i' -->
    <circle cx="52.5" cy="9.5" r="4.6" fill="#F97316"/>
    <!-- 'A' -->
    <path d="M23.5 9L7 45H15.8L19.1 37.2H33.9L37.2 45H46L29.5 9H23.5ZM21.8 30.4L26.5 18.8L31.2 30.4H21.8Z" fill="url(#acaBlue)"/>
    <!-- 'i' stem -->
    <rect x="48.5" y="18" width="8" height="27" rx="2" fill="url(#acaBlue)"/>
    <!-- 'R' -->
    <path d="M63 9V45H71V32.5H76.5L84.5 45H94L84.8 31.2C89.5 29.5 92.5 25.6 92.5 20.5C92.5 13.6 87.3 9 79.2 9H63ZM71 15.6H78.4C82.4 15.6 84.6 17.4 84.6 20.6C84.6 23.8 82.4 25.8 78.4 25.8H71V15.6Z" fill="url(#acaBlue)"/>
    <!-- Signature Airflow Wave cutting across AiR -->
    <path d="M2 31.5C21 23.5 44 22.5 68 27.5C80 30 92 28.5 101 23.5" stroke="url(#acaSwoosh)" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- "CONCEPTS" -->
  <text x="112" y="49" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="35" font-weight="300" letter-spacing="1.5">CONCEPTS</text>

  <!-- Bottom Dotted Airflow Line + "AUSTRALIA" -->
  <g transform="translate(8, 63)">
    <circle cx="6" cy="0" r="1.8" fill="#38BDF8" opacity="0.65"/>
    <circle cx="15" cy="0" r="1.8" fill="#38BDF8" opacity="0.75"/>
    <circle cx="24" cy="0" r="1.8" fill="#38BDF8" opacity="0.85"/>
    <circle cx="33" cy="0" r="1.8" fill="#38BDF8"/>
    <line x1="42" y1="0" x2="98" y2="0" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>

    <text x="172" y="4" fill="#94A3B8" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="5.5" text-anchor="middle">AUSTRALIA</text>

    <line x1="246" y1="0" x2="302" y2="0" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="311" cy="0" r="1.8" fill="#38BDF8"/>
    <circle cx="320" cy="0" r="1.8" fill="#38BDF8" opacity="0.85"/>
    <circle cx="329" cy="0" r="1.8" fill="#38BDF8" opacity="0.75"/>
    <circle cx="338" cy="0" r="1.8" fill="#38BDF8" opacity="0.65"/>
  </g>
</svg>
